[pytest]
# The globally-installed `hydra_pytest` plugin (hydra-core 1.1.0) fails to
# import under Python 3.14 (`typing.io` was removed). It is unrelated to these
# tests, so disable it. The gltest plugins provide the direct-mode fixtures.
addopts = -p no:hydra_pytest -p no:langsmith_plugin
testpaths = tests/direct
markers =
    slow: end-to-end tests with real web + LLM calls (opt in with -m slow)
    e2e: live state-mutating flow against the deployed StudioNet contract (opt in with -m e2e)
